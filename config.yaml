name: "Bookplate"
description: "OPDS 1.2 book catalog, KOSync progress sync, and web library manager for KoReader"
version: "0.9.1"
slug: "bookplate"
image: "ghcr.io/korzun/bookplate-{arch}"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Book server — OPDS, KOSync, Web UI"
map:
  - media:rw
  - data:rw
options:
  library_name: Bookplate
  library_dir: books
  username: admin
  password: changeme
  max_concurrent_uploads: 3
  validation_threshold: Error
  trust_proxy_hops: 0
  email_cloudflare_account_id: ""
  email_cloudflare_api_token: ""
  email_from_address: ""
  email_from_name: ""
  public_url: ""
schema:
  library_name: str
  library_dir: str
  username: str
  password: str
  max_concurrent_uploads: int
  validation_threshold: "list(Fatal|Error|Warning|Info)"
  trust_proxy_hops: int
  email_cloudflare_account_id: "str?"
  email_cloudflare_api_token: "password?"
  email_from_address: "str?"
  email_from_name: "str?"
  public_url: "str?"

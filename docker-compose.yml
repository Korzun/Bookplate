# Bookplate as one container. `cp .env.example .env`, fill it in (set
# ADMIN_PASS before the first start), then `docker compose up -d`. Every value
# here falls back to the app's default when the .env line is missing or empty.
#
# The dev stack with live reload is docker-compose.dev.yml (`make dev`).
services:
  bookplate:
    build: .
    image: bookplate:local
    # Always build from this checkout on `up`, so `git pull && docker compose
    # up -d` runs the new code instead of the image already under the tag.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASS: ${ADMIN_PASS:-}
      LIBRARY_NAME: ${LIBRARY_NAME:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      VALIDATION_THRESHOLD: ${VALIDATION_THRESHOLD:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOKS_DIR: /media/books
    volumes:
      - bookplate-data:/data
      - bookplate-books:/media/books

# bookplate-data holds the database; bookplate-books holds the EPUBs. To keep
# the books on a host path instead, replace the second mount above with
# `- /srv/books:/media/books`. The health check is built into the image;
# Compose reports it as `healthy`.
volumes:
  bookplate-data:
  bookplate-books:
